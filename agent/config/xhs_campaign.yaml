# 小红书推广主题与文案默认值（与 docs/introduce 口径一致）
product_name: "作业辅导AI助手"
one_liner: "家长上传孩子的兴趣与习惯，AI 生成个性化解题引导、趣味故事和漫画，帮孩子更愿意完成作业。"

# 系列选题 id：对应 introduce/06 中「系列选题建议」
theme_id: "interest_from_homework"
angle: "痛点" # 痛点 | 好奇 | 场景 | 利益 | 对比

# 标题模板（20 字内可改）；占位符 {product_name}
title_templates:
  - "辅导作业到心累？试试把题目变成「故事」"
  - "孩子坐不住？可能是讲题方式不对"
  - "双职工晚上带娃写作业，我这样少吼两句"
  - "数学题变成冒险故事，孩子终于愿意听了"
  - "用了三周，辅导作业的声音小了一半"
  - "把奥特曼写进应用题，娃自己凑过来看"
  - "不再边吼边写，换个方式讲题挺管用"
  - "试了这个工具，孩子主动问还有题吗"
  - "辅导作业像吵架？也许缺一个好故事"
  - "用孩子喜欢的角色讲题，效果真的不一样"
  - "作业辅导神器？不，只是个会讲故事的AI"
  - "晚上八点不再鸡飞狗跳，我们换了个方法"
  - "把枯燥的算术变成漫画，孩子居然笑了"

# 五段式正文骨架（composer 会填充 product_name 与合规句）
body_template:
  hook: |
    家里有没有同款：一讲题就急，孩子一听就躲？其实不一定是孩子笨，有时是「形式」不对——干巴巴讲步骤，不如先让孩子愿意听下去。
  turn: |
    最近在用微信小程序「{product_name}」：家长先填一填孩子的兴趣偏好，再围绕真实作业生成故事化讲解和漫画风插图，把题目嵌进娃喜欢的话题里。
  steps: |
    我们的用法很简单：上传/拍摄作业 → 等识别与生成 → 先一起读故事或看漫画 → 再回头做题。工具是辅助，陪伴还是家长自己来。
  feeling: |
    我家娃至少愿意先看「故事版」再动笔，冲突少了一些。（效果因家庭而异，仅供参考。）
  closing: |
    AI 生成内容可能有错，难题建议家长或老师再核对。适度使用屏幕，注意用眼与休息。

# 话题标签（不含 # 也可，composer 会规范化）
hashtags:
  - "亲子教育"
  - "辅导作业"
  - "学习工具"
  - "家庭教育"

# 合规：命中则 composer 报错或警告（来自 introduce/05 精神）
forbidden_phrases:
  - "必提分"
  - "保过"
  - "押题必中"
  - "最好"
  - "第一"
  - "100%准确"
  - "完全不用家长管"
  - "治愈焦虑"

# 素材路径（相对 agent 项目根目录）
# 与 xiaohongshu-mcp 对齐约定：
# - tools/xiaohongshu-mcp/images -> agent/imgs（软链）
# - 本配置保持 imgs/...，程序会自动映射为容器路径 /app/images/...
assets:
  cover_dir: "imgs/intruduce"
  story_glob: "imgs/story/**/*.png"
  story_glob_alt: "imgs/story/**/*.jpg"
  max_story_images: 4

# 可选：introduce 文档目录（默认 ../docs/introduce，相对 agent 根）
# introduce_docs_dir: "../docs/introduce"
