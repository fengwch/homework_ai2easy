# OCR 服务配置
# 敏感项（use_baidu_api_key 等）优先从环境变量读取，此处为默认/开关

use_gpu: false
gpu_memory: 500  # MB

# 识别引擎：baidu | paddle | qwen_vl（也可在 .env 中设置 OCR_ENGINE 覆盖）
# - baidu: 百度 OCR，需配置 BAIDU_OCR_API_KEY、BAIDU_OCR_SECRET_KEY
# - qwen_vl: 阿里云 Qwen-VL 多模态识别，需配置 DASHSCOPE_API_KEY
engine: baidu

# 百度 OCR（当 engine=baidu 时使用，APIKey/SecretKey 从环境变量 BAIDU_OCR_API_KEY / BAIDU_OCR_SECRET_KEY 读取）
# use_baidu: false
# 是否启用插图截取（截取题目中的「如图」等插图并保存），关闭后 figure_urls 与 metadata.figureUrls 均为空
ocr_figures_enabled: false
# 为按题截插图使用「含位置信息」接口（需在百度控制台开通），设为 false 则用 general_basic 且插图为整图均分
ocr_figures_use_location: true

enhancement:
  enabled: true
  contrast: true
  brightness: true
  sharpen: true

# 题目解析：题型、知识点、难度（可结合 LLM，LLM 配置从 .env 读取）
question_parsing:
  use_llm: true  # 是否用 LLM 做题型/知识点/难度推断
  subject_hint: "数学"  # 可由调用方传入覆盖
