syntax = "proto3";

package api.auth.v1;

import "google/api/annotations.proto";

option go_package = "homework_ai2easy/backend/api/auth/v1;v1";

// 认证服务
service AuthService {
  // 发送验证码
  rpc SendSMS (SendSMSRequest) returns (SendSMSReply) {
    option (google.api.http) = {
      post: "/api/v1/auth/send-sms"
      body: "*"
    };
  }

  // 手机号验证码登录
  rpc Login (LoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }

  // 微信一键登录
  rpc WechatLogin (WechatLoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/api/v1/auth/wechat-login"
      body: "*"
    };
  }

  // 密码登录
  rpc PasswordLogin (PasswordLoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/api/v1/auth/password-login"
      body: "*"
    };
  }

  // 用户注册
  rpc Register (RegisterRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/api/v1/auth/register"
      body: "*"
    };
  }

  // 刷新Token
  rpc Refresh (RefreshRequest) returns (RefreshReply) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
  }

  // 重置密码
  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordReply) {
    option (google.api.http) = {
      post: "/api/v1/auth/reset-password"
      body: "*"
    };
  }
}

// 发送验证码请求
message SendSMSRequest {
  string phone = 1;  // 手机号
  string scene = 2;   // 场景：login/reset_password
}

// 发送验证码响应
message SendSMSReply {
  int32 code = 1;
  string message = 2;
  SendSMSData data = 3;
}

message SendSMSData {
  int32 expires_in = 1;  // 过期时间（秒）
}

// 登录请求
message LoginRequest {
  string phone = 1;  // 手机号
  string code = 2;   // 验证码
}

// 密码登录请求
message PasswordLoginRequest {
  string phone = 1;     // 手机号
  string password = 2;  // 密码
}

// 微信登录请求
message WechatLoginRequest {
  string code = 1;           // 微信授权码（必填）
  string encrypted_data = 2;  // 加密数据（可选）
  string iv = 3;              // 初始向量（可选）
  string nick_name = 4;       // 微信昵称（可选，用于个人中心显示）
  string avatar_url = 5;      // 微信头像 URL（可选，用于列表/个人中心显示）
}

// 注册请求
message RegisterRequest {
  string phone = 1;     // 手机号
  string code = 2;      // 验证码
  string password = 3;  // 密码（可选）
  bool agreed = 4;       // 是否同意协议
}

// 登录响应
message LoginReply {
  int32 code = 1;
  string message = 2;
  LoginData data = 3;
}

message LoginData {
  string token = 1;
  UserInfo user_info = 2;
}

message UserInfo {
  int64 id = 1;
  string phone = 2;
  string nickname = 3;
  string avatar_url = 4;
  string wechat_openid = 5;
}

// 刷新Token请求
message RefreshRequest {
}

// 刷新Token响应
message RefreshReply {
  int32 code = 1;
  string message = 2;
  RefreshData data = 3;
}

message RefreshData {
  string token = 1;
}

// 重置密码请求
message ResetPasswordRequest {
  string phone = 1;        // 手机号
  string code = 2;         // 验证码
  string new_password = 3; // 新密码
}

// 重置密码响应
message ResetPasswordReply {
  int32 code = 1;
  string message = 2;
}
