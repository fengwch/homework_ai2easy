# 配置文件示例
# 复制此文件为 config.yaml 并根据实际情况修改配置

server:
  http:
    addr: 0.0.0.0:8000
    # timeout: 1s  # 过短会导致 /api/v1/contents/export-pdf-from-image 等接口易超时；生产建议 30s～60s
    timeout: 30s
  grpc:
    addr: 0.0.0.0:9002
    timeout: 1s
  # CORS 跨域（测试环境启用，便于前端直连）
  # cors:
  #   enabled: true
  #   allow_origins: ["http://localhost:5173","http://127.0.0.1:5173"]  # Vite 等；带 credentials 时不可 *
  #   allow_credentials: true
  #   allow_methods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
  #   allow_headers: ["Content-Type","Authorization","X-Requested-With","Accept","Origin","X-Device-Id","X-Platform"]

# 日志配置（Zap + lumberjack，遵循日志系统规范）
logger:
  level: info
  format: json
  output: both
  file_path: logs/app.log
  max_size: 100
  max_backups: 5
  max_age: 30
  compress: true
  enable_caller: true
  enable_stacktrace: false

data:
  database:
    driver: mysql
    source: root:root@tcp(127.0.0.1:3307)/smartstudy?charset=utf8mb4&parseTime=True&loc=Local
  redis:
    addr: 127.0.0.1:6379
    password: ""
    db: 0

jwt:
  secret: your-secret-key-change-in-production
  expires_in: 2592000s  # 30天

# 微信小程序登录（静默登录用 code 换 openid，需配置 AppID 和 AppSecret）
# 未配置时 POST /api/v1/auth/wechat-login 返回 400「微信登录未配置」
wechat:
  # app_id: "your-miniprogram-appid"
  # app_secret: "your-miniprogram-appsecret"  # 仅存后端，勿提交仓库
  # timeout: 30s  # code2Session 超时，默认 15s；网络慢或跨境可调大

# AI Agent 服务（OCR、内容生成等）
ai_agent:
  url: "http://0.0.0.0:8001"
  timeout: 600s  # 请求超时，默认 10 分钟，避免长任务超时

# SMS 配置
sms:
  expires_in: 300s  # 验证码过期时间（5分钟）
  
  # 开发模式（不实际发送短信，验证码打印在日志中）
  provider: mock
  
  # 测试环境万能验证码（仅测试配置使用）：配置后登录/注册/重置密码填此码即跳过校验
  # test_code: "123456"
  
  # 生产环境配置示例（阿里云）
  # provider: aliyun
  # access_key_id: "LTAI5txxxxxxxxxxxxx"
  # access_key_secret: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  # sign_name: "作业助手"  # 需要在阿里云平台申请
  # template_code: "SMS_123456789"  # 需要在阿里云平台申请
  # region: "cn-hangzhou"
  
  # 生产环境配置示例（腾讯云）
  # provider: tencent
  # access_key_id: "AKIDxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  # access_key_secret: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  # sign_name: "作业助手"
  # template_code: "1234567"  # 模板 ID
  # region: "ap-guangzhou"
  
  # 生产环境配置示例（华为云）
  # provider: huawei
  # access_key_id: "your-ak"
  # access_key_secret: "your-sk"
  # sign_name: "作业助手"
  # template_code: "xxxxxxxxxxxxxxxxxxxxx"
  # region: "cn-north-4"
